<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الصفحة مش موجودة · وين أرخص؟</title>
<meta name="theme-color" content="#07080C">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07080c;color:#f2f4ff;font-family:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;text-align:center;padding:24px;
    background-image:linear-gradient(to right,rgba(242,244,255,.05) 1px,transparent 1px),linear-gradient(to bottom,rgba(242,244,255,.05) 1px,transparent 1px);background-size:48px 48px}
  .mark{width:56px;height:56px;margin:0 auto 20px;background:#c6ff33;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
  h1{font-size:32px;margin:0 0 8px;font-weight:800} p{color:#b4b9cf;margin:0 0 24px}
  a{display:inline-flex;align-items:center;min-height:48px;padding:0 22px;background:#c6ff33;color:#07080c;font-weight:800;text-decoration:none;
    clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true"></div>
  <h1>الصفحة مش موجودة</h1>
  <p>ممكن الرابط غلط. ارجع للرئيسية ودوّر على اللي بدك إياه.</p>
  <a href="./">ارجع للرئيسية</a>
</main>
</body>
</html>
